name: Build CampusDesk Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional override for public HTTPS backend URL (defaults to repository variable VITE_API_BASE_URL)'
        required: false
        default: ''
      build_variant:
        description: 'APK signing mode (auto uses release keystore when secrets exist, otherwise debug)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - debug
          - release

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Install dependencies
        run: npm ci

      - name: Validate API base URL & metadata
        id: config
        env:
          INPUT_API_URL: ${{ github.event.inputs.api_base_url }}
          VAR_API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          API_URL="${INPUT_API_URL:-$VAR_API_URL}"
          API_URL="${API_URL%/}"

          if echo "$API_URL" | grep -qiE '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0|10\.0\.2\.2)(:|/|$)'; then
            echo "::error::VITE_API_BASE_URL must not point to localhost or 127.0.0.1 in Android APK builds."
            exit 1
          fi

          if [ -n "$API_URL" ] && ! echo "$API_URL" | grep -qiE '^https://'; then
            echo "::warning::VITE_API_BASE_URL should use HTTPS for Android release builds (cleartext HTTP is disabled)."
          fi

          if [ -z "$API_URL" ]; then
            echo "::warning::VITE_API_BASE_URL is not configured. The APK will build, but users will see a backend configuration notice until rebuilt with a public HTTPS VITE_API_BASE_URL."
          else
            echo "Using VITE_API_BASE_URL=$API_URL"
          fi

          VERSION=$(node -p "require('./package.json').version")
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Typecheck frontend & server
        run: npm run lint

      - name: Build production web bundle
        env:
          VITE_API_BASE_URL: ${{ steps.config.outputs.api_url }}
        run: |
          npm run build
          if [ -d dist/assets/aistudio ]; then
            echo "::error::Raw uploaded CSV/PDF assets leaked into dist/assets/aistudio"
            exit 1
          fi

      - name: Sync web bundle to Android Capacitor project
        run: npx cap sync android

      - name: Build Android APK
        id: apk
        env:
          ANDROID_VERSION_NAME: ${{ steps.config.outputs.app_version }}
          ANDROID_VERSION_CODE: '1'
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_VARIANT: ${{ github.event.inputs.build_variant }}
        run: |
          chmod +x android/gradlew
          mkdir -p release-output
          APK_FILENAME="CampusDesk-v${ANDROID_VERSION_NAME}.apk"

          HAS_KEYSTORE=false
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            HAS_KEYSTORE=true
          fi

          if [ "$BUILD_VARIANT" = "release" ] && [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::Release variant selected, but ANDROID_KEYSTORE_BASE64 / PASSWORD / ALIAS secrets are missing."
            exit 1
          fi

          if [ "$BUILD_VARIANT" != "debug" ] && [ "$HAS_KEYSTORE" = "true" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/campusdesk-release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/campusdesk-release.jks"
            export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASS"
            export ANDROID_KEY_ALIAS="$KEY_ALIAS"
            export ANDROID_KEY_PASSWORD="$KEY_PASS"

            (cd android && ./gradlew assembleRelease --no-daemon)
            BUILT_APK="android/app/build/outputs/apk/release/app-release.apk"
            SIGNING_LABEL="release-signed"
          else
            echo "::notice::Building debug-signed APK (set ANDROID_KEYSTORE_* secrets for production release signing)."
            (cd android && ./gradlew assembleDebug --no-daemon)
            BUILT_APK="android/app/build/outputs/apk/debug/app-debug.apk"
            SIGNING_LABEL="debug-signed"
          fi

          if [ ! -s "$BUILT_APK" ]; then
            echo "::error::Expected APK not found or empty at $BUILT_APK"
            exit 1
          fi

          cp "$BUILT_APK" "release-output/${APK_FILENAME}"
          ls -lh "release-output/${APK_FILENAME}"
          echo "apk_path=release-output/${APK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "signing_label=$SIGNING_LABEL" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/campusdesk-release.jks"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusDesk-Android-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
