name: Release CampusDesk Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name to build and publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish CampusDesk Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Install dependencies
        run: npm ci

      - name: Derive release version & validate API config
        id: meta
        env:
          EVENT_TAG: ${{ github.event.inputs.tag }}
          VAR_API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$EVENT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION_NAME="${TAG#v}"
          BASE_VER="${VERSION_NAME%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VER"
          MAJOR="${MAJOR:-1}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"

          if ! echo "$MAJOR$MINOR$PATCH" | grep -qE '^[0-9]+$'; then
            VERSION_CODE=1
          else
            VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH - 9999 ))
            if [ "$VERSION_CODE" -lt 1 ]; then
              VERSION_CODE=1
            fi
          fi

          API_URL="${VAR_API_URL%/}"
          if echo "$API_URL" | grep -qiE '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0|10\.0\.2\.2)(:|/|$)'; then
            echo "::error::VITE_API_BASE_URL must not point to localhost or 127.0.0.1 in a release APK."
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "::warning::VITE_API_BASE_URL is unset. Release APK will build, but requires VITE_API_BASE_URL repository variable for live data."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Typecheck frontend & server
        run: npm run lint

      - name: Build production web bundle
        env:
          VITE_API_BASE_URL: ${{ steps.meta.outputs.api_url }}
        run: |
          npm run build
          if [ -d dist/assets/aistudio ]; then
            echo "::error::Raw uploaded CSV/PDF assets leaked into dist/assets/aistudio"
            exit 1
          fi

      - name: Sync web bundle to Android Capacitor project
        run: npx cap sync android

      - name: Build Release APK
        id: apk
        env:
          ANDROID_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          mkdir -p release-output
          APK_FILENAME="CampusDesk-${RELEASE_TAG}.apk"

          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/campusdesk-release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/campusdesk-release.jks"
            export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASS"
            export ANDROID_KEY_ALIAS="$KEY_ALIAS"
            export ANDROID_KEY_PASSWORD="$KEY_PASS"

            (cd android && ./gradlew assembleRelease --no-daemon)
            BUILT_APK="android/app/build/outputs/apk/release/app-release.apk"
            SIGNING_MODE="Production Release Keystore Signed"
          else
            echo "::notice::ANDROID_KEYSTORE_* secrets not configured; publishing debug-signed APK for side-loading/testing."
            (cd android && ./gradlew assembleDebug --no-daemon)
            BUILT_APK="android/app/build/outputs/apk/debug/app-debug.apk"
            SIGNING_MODE="Debug-Signed (Side-Load Testing Build — configure ANDROID_KEYSTORE_* secrets for production signing)"
          fi

          if [ ! -s "$BUILT_APK" ]; then
            echo "::error::Expected APK not found or empty at $BUILT_APK"
            exit 1
          fi

          cp "$BUILT_APK" "release-output/${APK_FILENAME}"
          SHA256=$(sha256sum "release-output/${APK_FILENAME}" | awk '{print $1}')

          echo "apk_path=release-output/${APK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "apk_filename=${APK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "signing_mode=${SIGNING_MODE}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/campusdesk-release.jks"

      - name: Generate Release Notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APK_FILENAME: ${{ steps.apk.outputs.apk_filename }}
          SIGNING_MODE: ${{ steps.apk.outputs.signing_mode }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          API_URL: ${{ steps.meta.outputs.api_url }}
        run: |
          if [ -n "$API_URL" ]; then
            BACKEND_NOTE="Configured public API endpoint: \`$API_URL\`"
          else
            BACKEND_NOTE="**Warning:** Built without \`VITE_API_BASE_URL\` repository variable. Set \`VITE_API_BASE_URL\` to a public HTTPS CampusDesk server and re-run the release workflow before distributing widely."
          fi

          cat <<EOF > release-notes.md
          # CampusDesk ${TAG}

          Official Android APK release for **CampusDesk** — Smart Faculty Locator, Availability Management, Direct Contact & Department Events.

          ## Package Details
          - **Application Name:** CampusDesk
          - **Package ID:** \`com.campusdesk.app\`
          - **Version:** \`${VERSION_NAME}\` (versionCode \`${VERSION_CODE}\`)
          - **Signing Status:** ${SIGNING_MODE}
          - **APK File:** \`${APK_FILENAME}\`
          - **SHA-256:** \`${APK_SHA256}\`
          - **Backend Status:** ${BACKEND_NOTE}

          ## Features Included
          - **Live Faculty Directory & Availability:** Department tabs, real-time/demo clock statuses (In Class, In Meeting, Free in Cabin, On Leave, Off Duty), and search by name, ID, designation, room, or department.
          - **Daily Schedule Drawer & Meeting Requests:** Tap any faculty card for full daily slots and submit meeting requests tracked via Student ID or Tracking Code.
          - **Direct Phone & Email Actions:** One-tap Call (\`tel:\`) and Email (\`mailto:\`) actions directly from faculty cards and detail drawers.
          - **Department Events Hub:** Filterable university events by department, category, and registration status with full event details.
          - **Faculty & Admin Portals:** Manage availability, leave dates, personal/departmental timetables, CSV imports, and Department Events.

          ## Android Installation Instructions
          1. On your Android phone, download **\`${APK_FILENAME}\`** from **Assets** below.
          2. Tap the downloaded APK file in your browser downloads or Files app.
          3. If prompted, allow **Install unknown apps** for your browser or file manager in Android Settings.
          4. Confirm **Install** and open **CampusDesk** from your home screen.

          ## Known Limitations
          - Direct APK installation requires enabling **Install from unknown sources** because the app is distributed via GitHub Releases rather than Google Play Store.
          - Live faculty schedules, availability updates, meeting requests, and events require an active internet connection to a publicly reachable HTTPS CampusDesk backend server.
          EOF

      - name: Upload APK artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: CampusDesk-Android-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: CampusDesk ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
